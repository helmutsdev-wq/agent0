appId: com.agent0.app
productName: Agent O
directories:
  buildResources: build
  output: release2
files:
  - out/**/*
  - "!node_modules/**/*"
icon: build/icon.png
win:
  target:
    - nsis
  signAndEditExecutable: false
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Agent O
